name: Auron verification

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auron_ci
          POSTGRES_PASSWORD: auron_ci
          POSTGRES_DB: auron_ci_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auron_ci -d auron_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://auron_verify:unused@127.0.0.1:1/auron_verify_no_application_db?connect_timeout=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure isolated test environment
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          # Public test-only credentials for this job's disposable service.
          echo "TEST_DATABASE_URL=postgresql+psycopg://auron_ci:auron_ci@127.0.0.1:$CI_POSTGRES_PORT/auron_ci_test" >> "$GITHUB_ENV"
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/auron-tokenizer" >> "$GITHUB_ENV"
      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          python -m pip check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Provision validated tokenizer assets
        working-directory: backend
        run: python -m app.scripts.provision_tokenizer
      - name: Prepare disposable schema and check migration drift
        working-directory: backend
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic check
      - name: Run the shared full verification gate
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode full -Python python -DisposableTestDatabase
